{% extends "base.html" %}
{% block title %}{{ title }} — MediVault{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><i class="bi bi-person-badge"></i> {{ title }}</div>
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary"><i class="bi bi-save"></i> Save doctor</button>
        <a href="{% url 'doctors:doctor_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
